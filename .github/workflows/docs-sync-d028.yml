name: Sync D028 Home Audio Status

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - ".github/workflows/docs-sync-d028.yml"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-pack-v2-d027
          fetch-depth: 0

      - name: Synchronize repository status documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # PROJECT_STATUS.md
          p = Path("PROJECT_STATUS.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "- AUDIO_02_STATUS: IN PROGRESS / HOME-ONLY V2 INSTALLED / DEVICE SMOKE PENDING",
              "- AUDIO_02_STATUS: IN PROGRESS / HOME-ONLY V2 INSTALLED / TECHNICAL GATES PASS / DEVICE SMOKE PENDING",
          )
          s = s.replace(
              "- DEVICE_AUDIO_SMOKE: PENDING owner verification of installed HOME-ONLY v2 assets",
              "- AUDIO_V2_BUNDLED_QC: PASS — run `32513695237`\n- AUDIO_V2_ANDROID_CI: PASS — run `32513695238` (`test` / `assembleDebug` / `assembleRelease`)\n- DEVICE_AUDIO_SMOKE: PENDING owner verification of installed HOME-ONLY v2 assets",
          )
          s = s.replace(
              "Для домашнего использования владелец принял человеческий пакет GCompris: 33/33 v2-ассета установлены и имеют приоритет над v1. AUDIO-02 остаётся `IN PROGRESS` до физического device smoke. Публичное или стороннее распространение сборки заблокировано: перед ним HOME-ONLY пакет должен быть заменён либо должно быть отдельно принято и выполнено лицензионное решение по распространению.",
              "Для домашнего использования владелец выбрал человеческий пакет GCompris: 33/33 v2-ассета установлены и имеют приоритет над v1. Bundled-audio QC, JVM/Compose tests, debug build и release build с R8/resource shrinking — PASS. AUDIO-02 остаётся `IN PROGRESS` только до физического прослушивания всех 33 букв на устройстве. При owner PASS задача закрывается как `DONE FOR HOME USE`; это не снимает distribution gate. Перед любой передачей или публикацией HOME-ONLY пакет должен быть заменён либо должно быть отдельно принято и выполнено лицензионное решение по распространению.",
          )
          s = s.replace(
              "## Следующий шаг\n\nОбязательных задач MVP не осталось.\n\nПо желанию владельца: подготовка production signing keys и публикация в Google Play / RuStore.",
              "## Следующий шаг\n\nMVP v1.0.0 остаётся закрытым. Текущий Post-MVP шаг — **AUDIO-02 device smoke** на физическом Pixel 7a: прослушать все 33 буквы, проверить правильность названий, отсутствие обрезания начала/конца и фактическое использование v2.\n\nЕсли smoke = PASS, AUDIO-02 закрывается как `DONE FOR HOME USE`, после чего PR #16 может быть подготовлен к merge только по отдельному решению владельца. Следующая продуктовая задача D027 после AUDIO-02 — **UX-01** (визуальная иерархия действий на ResultScreen). Публичное распространение при текущем GCompris HOME-ONLY пакете остаётся заблокированным.",
          )
          p.write_text(s, encoding="utf-8")

          # BACKLOG.md
          p = Path("docs/BACKLOG.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "[AUDIO-02] Подготовка и интеграция обновлённого пакета аудио-ассетов букв v2 — IN PROGRESS / HOME-ONLY V2 INSTALLED / DEVICE SMOKE PENDING.",
              "[AUDIO-02] Подготовка и интеграция обновлённого пакета аудио-ассетов букв v2 — IN PROGRESS / HOME-ONLY V2 INSTALLED / TECHNICAL GATES PASS / DEVICE SMOKE PENDING.",
          )
          marker = "  - [x] выполнен технический duration QC: 21/33 в `400–700 мс`, 8 короче, `Ф` — 720 мс, `Й/Ъ/Ь` длиннее как естественные артикуляционные исключения; искусственный time-stretch/pitch-shift не применяется;\n"
          addition = marker + "  - [x] bundled-v2 QC — PASS, run `32513695237`; Android CI `test` / `assembleDebug` / `assembleRelease` — PASS, run `32513695238`;\n"
          if "run `32513695237`" not in s:
              s = s.replace(marker, addition)
          s = s.replace(
              "  - [ ] выполнить device smoke: mapping всех букв, отсутствие обрезания начала/конца, fallback при намеренно отсутствующем v2-ресурсе.",
              "  - [ ] выполнить owner device smoke на Pixel 7a: прослушать все 33 буквы, подтвердить правильность произношения/маппинга, отсутствие обрезания начала/конца и фактическое использование v2; после PASS закрыть AUDIO-02 как `DONE FOR HOME USE`.",
          )
          p.write_text(s, encoding="utf-8")

          # NEXT_TASK.md — replace stale publication-first guidance.
          Path("NEXT_TASK.md").write_text("""# NEXT_TASK.md — Post-MVP D027\n\n## Текущий статус\n\n**MVP v1.0.0 закрыт и остаётся COMPLETE / OWNER ACCEPTED. Активная Post-MVP работа — D027.**\n\n### AUDIO-02 — почти завершено для домашней версии\n\n- GCompris HOME-ONLY Audio Pack v2: **33 / 33 INSTALLED**;\n- playback order: `v2 local -> v1 local -> TTS`;\n- все 33 v2 raw resources проверяются автоматическим тестом;\n- bundled-v2 QC: **PASS**, run `32513695237`;\n- Android CI: **PASS**, run `32513695238`;\n- `test` / `assembleDebug` / `assembleRelease` + R8/resource shrinking: **PASS**;\n- repository visibility: **private**;\n- distribution gate: **ACTIVE**.\n\n## Следующее действие владельца\n\nНа физическом Pixel 7a прослушать все 33 буквы в обычном приложении и проверить:\n\n1. каждой букве соответствует правильное русское название;\n2. используется новый GCompris v2, а не v1/TTS;\n3. начало и окончание записи не обрезаны;\n4. громкость и тембр приемлемы в реальном занятии;\n5. длинные `Й`, `Ъ`, `Ь` не мешают учебному потоку.\n\nЕсли все 33 пункта проходят без критичного дефекта, владелец сообщает **AUDIO-02 SMOKE PASS**. После этого AUDIO-02 фиксируется как `DONE FOR HOME USE`. PR #16 остаётся draft до отдельной команды владельца на подготовку/merge.\n\n## После AUDIO-02\n\nСледующая задача D027 — **UX-01**: привести primary/secondary действия `ResultScreen` к правилу для нечитающего ребёнка и проверить success/failure Compose tests.\n\n## Ограничение распространения\n\nТекущий GCompris v2 — **HOME-ONLY**. Перед передачей APK/AAB, передачей репозитория третьим лицам, переводом репозитория в public или публикацией в магазине этот аудиопак необходимо заменить либо отдельно выполнить лицензионное решение для предполагаемого способа распространения. См. `docs/AUDIO_DISTRIBUTION_NOTICE.md`.\n""", encoding="utf-8")

          # DECISIONS.md — append the accepted home-use decision once.
          p = Path("docs/DECISIONS.md")
          s = p.read_text(encoding="utf-8")
          if "D028: GCompris HOME-ONLY Audio Pack v2" not in s:
              s += """\n\n## 2026-08-21 — D028: GCompris HOME-ONLY Audio Pack v2 для семейного использования\n\n`DECISION_SOURCE: OWNER`\n\nДля текущей приватной семейной версии App_ABC владелец выбрал человеческий русский пакет GCompris `voices/ru/alphabet` (диктор upstream: Alexey V. Lubimov) как Audio Pack v2. В `feature/audio-pack-v2-d027` интегрированы 33/33 OGG с именами `sound_letter_<token>_v2.ogg`; порядок воспроизведения остаётся `v2 local -> v1 local -> TTS`. Голос не подвергается time-stretch или pitch-shift.\n\nТехнические gates интеграции пройдены: bundled-v2 QC PASS (`32513695237`), Android CI PASS (`32513695238`), включая JVM/Compose tests, `assembleDebug` и `assembleRelease` с R8/resource shrinking. Окончательная приёмка AUDIO-02 для домашнего использования требует owner device smoke всех 33 букв на физическом устройстве. При PASS статус закрывается как `DONE FOR HOME USE`.\n\nGCompris-пакет считается `HOME-ONLY`. Приватность репозитория не отменяет лицензионных условий. Перед любой передачей или публичным распространением APK/AAB/репозитория текущий Audio Pack v2 должен быть заменён либо должно быть отдельно принято и выполнено лицензионное решение, совместимое с предполагаемым способом распространения. Этот distribution gate не снимается закрытием AUDIO-02 для домашнего использования.\n\nD028 не меняет LearningPolicy v4, Curriculum v3, Room schema 2 и звуки `correct` / `wrong` / `level_complete`. После AUDIO-02 следующим незакрытым пунктом D027 остаётся UX-01 для `ResultScreen`.\n"""
              p.write_text(s, encoding="utf-8")

          # README: show the active post-MVP state near the existing warning.
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          warning = "> **AUDIO DISTRIBUTION BLOCKER:** если для D027 / Audio Pack v2 используется HOME-ONLY аудиотека (например, локальный пакет GCompris), перед любой публикацией или передачей APK/AAB/репозитория её необходимо полностью заменить на аудиопак с подтверждённой лицензией для распространения. HOME-ONLY аудио нельзя коммитить в публичный репозиторий. См. [docs/AUDIO_DISTRIBUTION_NOTICE.md](docs/AUDIO_DISTRIBUTION_NOTICE.md).\n"
          status = warning + "\n**Post-MVP D027 status:** GCompris HOME-ONLY Audio Pack v2 установлен `33/33`; bundled QC и Android CI (`test` / `assembleDebug` / `assembleRelease`) — PASS. До закрытия AUDIO-02 для домашней версии остаётся owner device smoke 33 букв.\n"
          if "Post-MVP D027 status:" not in s:
              s = s.replace(warning, status)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit synchronized docs
        shell: bash
        run: |
          git rm .github/workflows/docs-sync-d028.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md NEXT_TASK.md docs/BACKLOG.md docs/DECISIONS.md
          git commit -m "docs: record D028 home audio decision and next step"
          git push origin HEAD:feature/audio-pack-v2-d027
