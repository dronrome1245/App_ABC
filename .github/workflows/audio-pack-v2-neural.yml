name: Audio Pack v2 Neural Experiment

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - "tools/probe_dialogs_ru_space.py"
      - "tools/generate_dialogs_ru_v2.py"
      - ".github/workflows/audio-pack-v2-neural.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/probe_dialogs_ru_space.py"
      - "tools/generate_dialogs_ru_v2.py"
      - ".github/workflows/audio-pack-v2-neural.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audio and Gradio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check gradio_client

      - name: Discover Dialogs-RU expressive TTS API
        run: python3 tools/probe_dialogs_ru_space.py

      - name: Generate four female voice/style previews
        run: |
          python3 tools/generate_dialogs_ru_v2.py \
            --mode preview \
            --profiles masha-neutral,masha-happy,sveta-neutral,sveta-happy \
            --output build/dialogs-ru-v2

      - name: Upload neural TTS preview matrix
        uses: actions/upload-artifact@v4
        with:
          name: dialogs-ru-v2-preview-matrix
          path: |
            build/dialogs-ru-v2/
            build/dialogs-ru-space-api.txt
          if-no-files-found: error
          retention-days: 7
