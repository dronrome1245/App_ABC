name: Audio Pack v2 Neural Experiment

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - "tools/probe_dialogs_ru_space.py"
      - "tools/generate_dialogs_ru_v2.py"
      - "tools/generate_dialogs_ru_direct_v2.py"
      - ".github/workflows/audio-pack-v2-neural.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/probe_dialogs_ru_space.py"
      - "tools/generate_dialogs_ru_v2.py"
      - "tools/generate_dialogs_ru_direct_v2.py"
      - ".github/workflows/audio-pack-v2-neural.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio and model tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.3.1 numpy==1.26.4 scipy librosa huggingface_hub

      - name: Generate full Masha neutral pack
        run: |
          python tools/generate_dialogs_ru_direct_v2.py \
            --speaker masha \
            --emotion neutral \
            --output build/dialogs-ru-direct-neutral

      - name: Verify Masha neutral file count
        run: |
          count=$(find build/dialogs-ru-direct-neutral/masha-neutral -maxdepth 1 -type f -name 'sound_letter_*_v2.ogg' | wc -l)
          test "$count" -eq 33

      - name: Generate full Masha happy pack
        run: |
          python tools/generate_dialogs_ru_direct_v2.py \
            --speaker masha \
            --emotion happy \
            --output build/dialogs-ru-direct-happy

      - name: Verify Masha happy file count
        run: |
          count=$(find build/dialogs-ru-direct-happy/masha-happy -maxdepth 1 -type f -name 'sound_letter_*_v2.ogg' | wc -l)
          test "$count" -eq 33

      - name: Upload full neural candidates
        uses: actions/upload-artifact@v4
        with:
          name: dialogs-ru-v2-full-candidates
          path: |
            build/dialogs-ru-direct-neutral/
            build/dialogs-ru-direct-happy/
          if-no-files-found: error
          retention-days: 14
