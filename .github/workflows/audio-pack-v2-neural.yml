name: Audio Pack v2 Neural Experiment

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - "tools/probe_dialogs_ru_space.py"
      - "tools/generate_dialogs_ru_v2.py"
      - "tools/generate_dialogs_ru_direct_v2.py"
      - ".github/workflows/audio-pack-v2-neural.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/probe_dialogs_ru_space.py"
      - "tools/generate_dialogs_ru_v2.py"
      - "tools/generate_dialogs_ru_direct_v2.py"
      - ".github/workflows/audio-pack-v2-neural.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-duration-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio and model tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.3.1 numpy==1.26.4 scipy librosa huggingface_hub

      - name: Generate direct duration-calibrated preview
        run: |
          python tools/generate_dialogs_ru_direct_v2.py \
            --letters А,Б,Л,Ф \
            --speaker masha \
            --emotion neutral \
            --output build/dialogs-ru-direct-v2

      - name: Upload direct neural preview
        uses: actions/upload-artifact@v4
        with:
          name: dialogs-ru-direct-v2-calibration
          path: build/dialogs-ru-direct-v2/
          if-no-files-found: error
          retention-days: 7
