name: Audio Pack v2 Qwen3 TTS Russian Audition

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - "tools/probe_qwen3_tts_space.py"
      - "tools/generate_qwen3_ru_audition.py"
      - ".github/workflows/audio-pack-v2-qwen-probe.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/probe_qwen3_tts_space.py"
      - "tools/generate_qwen3_ru_audition.py"
      - ".github/workflows/audio-pack-v2-qwen-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen3-russian-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gradio and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check gradio_client
      - name: Inspect public Qwen3-TTS Space API
        run: python tools/probe_qwen3_tts_space.py
      - name: Generate one batched native-Russian phonetic audition
        run: python tools/generate_qwen3_ru_audition.py --output build/qwen3-ru-audition
      - name: Verify audition files
        run: |
          test -s build/qwen3-ru-audition/qwen3_russian_diagnostic.mp3
          test -s build/qwen3-ru-audition/qwen3_russian_diagnostic.ogg
          test -s build/qwen3-ru-audition/diagnostic.json
      - name: Upload Qwen3 Russian audition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-ru-v2-batched-audition
          path: build/qwen3-ru-audition/
          if-no-files-found: warn
          retention-days: 14
