name: Finalize HOME-ONLY GCompris Audio Pack v2

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - ".github/workflows/audio-pack-v2-home-install.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-home-only-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/audio-pack-v2-d027
          fetch-depth: 0

      - name: Verify installed v2 assets
        shell: bash
        run: |
          count=$(find app/src/main/res/raw -maxdepth 1 -type f -name 'sound_letter_*_v2.ogg' | wc -l)
          test "$count" -eq 33
          echo "Verified HOME-ONLY v2 assets: $count/33"

      - name: Update project status and backlog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          replacements = {
              "- AUDIO_02_STATUS: IN PROGRESS / STUDIO ASSETS REQUIRED":
                  "- AUDIO_02_STATUS: IN PROGRESS / HOME-ONLY V2 INSTALLED / DEVICE SMOKE PENDING",
              "- BUNDLED_V2_LETTER_ASSETS: 0 / 33":
                  "- BUNDLED_V2_LETTER_ASSETS: 33 / 33 (HOME-ONLY GCOMPRIS)",
              "- STUDIO_V2_DURATION_TARGET: 400–700 ms per letter, subject to justified articulation exceptions":
                  "- V2_DURATION_TARGET: 400–700 ms per letter, subject to justified articulation exceptions",
              "- STUDIO_V2_CONTENT_STATUS: PENDING — no new v2 OGG binaries are present in the repository yet":
                  "- HOME_ONLY_V2_CONTENT_STATUS: INSTALLED — 33/33 human-recorded GCompris OGGs; distribution remains blocked until replacement/relicensing decision",
              "- DEVICE_AUDIO_SMOKE: PENDING actual v2 assets":
                  "- DEVICE_AUDIO_SMOKE: PENDING owner verification of installed HOME-ONLY v2 assets",
              "AUDIO-02 нельзя переводить в `DONE`, пока реальные студийные v2-ассеты не добавлены и не проверены по длительности/воспроизведению. Технический слой подготовлен так, чтобы v2 автоматически имел приоритет, а при отсутствии конкретного файла приложение безопасно использовало v1 и затем TTS.":
                  "Для домашнего использования владелец принял человеческий пакет GCompris: 33/33 v2-ассета установлены и имеют приоритет над v1. AUDIO-02 остаётся `IN PROGRESS` до физического device smoke. Публичное или стороннее распространение сборки заблокировано: перед ним HOME-ONLY пакет должен быть заменён либо должно быть отдельно принято и выполнено лицензионное решение по распространению."
          }
          for old, new in replacements.items():
              if old not in status:
                  raise RuntimeError(f"PROJECT_STATUS marker not found: {old}")
              status = status.replace(old, new, 1)
          status_path.write_text(status, encoding="utf-8")

          backlog_path = Path("docs/BACKLOG.md")
          backlog = backlog_path.read_text(encoding="utf-8")
          old_title = "- [ ] **[AUDIO-02] Подготовка и интеграция обновлённого пакета аудио-ассетов букв v2 — IN PROGRESS / STUDIO ASSETS REQUIRED.**"
          new_title = "- [ ] **[AUDIO-02] Подготовка и интеграция обновлённого пакета аудио-ассетов букв v2 — IN PROGRESS / HOME-ONLY V2 INSTALLED / DEVICE SMOKE PENDING.**"
          if old_title not in backlog:
              raise RuntimeError("BACKLOG AUDIO-02 title marker not found")
          backlog = backlog.replace(old_title, new_title, 1)

          old_asset = "  - [ ] добавить 33 реальные студийные letter OGG v2 с мягким, певучим и протяжным детским/педагогическим тембром;"
          new_asset = "  - [x] для домашней сборки интегрированы 33/33 реальные человеческие GCompris letter OGG v2; пакет помечен HOME-ONLY и не считается разрешённым для распространения;"
          if old_asset not in backlog:
              raise RuntimeError("BACKLOG asset marker not found")
          backlog = backlog.replace(old_asset, new_asset, 1)

          old_duration = "  - [ ] проверить фактическую длительность каждого v2-ассета: целевой диапазон `400–700 мс` с допустимыми обоснованными отклонениями;"
          new_duration = "  - [x] выполнен технический duration QC: 21/33 в `400–700 мс`, 8 короче, `Ф` — 720 мс, `Й/Ъ/Ь` длиннее как естественные артикуляционные исключения; искусственный time-stretch/pitch-shift не применяется;"
          if old_duration not in backlog:
              raise RuntimeError("BACKLOG duration marker not found")
          backlog = backlog.replace(old_duration, new_duration, 1)

          smoke = "  - [ ] выполнить device smoke: mapping всех букв, отсутствие обрезания начала/конца, fallback при намеренно отсутствующем v2-ресурсе."
          gate = smoke + "\n  - [x] установлен distribution gate: перед любой публикацией/передачей приложения HOME-ONLY GCompris v2 необходимо заменить либо отдельно закрыть требования лицензии для выбранного способа распространения."
          if smoke not in backlog:
              raise RuntimeError("BACKLOG smoke marker not found")
          backlog = backlog.replace(smoke, gate, 1)
          backlog_path.write_text(backlog, encoding="utf-8")
          PY

      - name: Remove one-shot installer and commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/audio-pack-v2-home-install.yml
          git add -- PROJECT_STATUS.md docs/BACKLOG.md
          git commit -m "docs(audio): record HOME-ONLY GCompris v2 integration"
          git push origin HEAD:feature/audio-pack-v2-d027
