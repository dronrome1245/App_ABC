name: Audio Pack v2 Candidate QC

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - "tools/build_audio_pack_v2.py"
      - ".github/workflows/audio-pack-v2-qc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build 33-letter candidate pack and QC report
        run: python3 tools/build_audio_pack_v2.py --output build/audio-pack-v2

      - name: Verify candidate file count
        run: |
          count=$(find build/audio-pack-v2 -maxdepth 1 -type f -name 'sound_letter_*_v2.ogg' | wc -l)
          test "$count" -eq 33

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-pack-v2-candidate
          path: build/audio-pack-v2/
          if-no-files-found: error
          retention-days: 7
