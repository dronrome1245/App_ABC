name: Audio Pack v2 Human Candidate QC

on:
  push:
    branches:
      - feature/audio-pack-v2-d027
    paths:
      - "tools/build_audio_pack_v2.py"
      - "tools/probe_commons_spoken_names.py"
      - "tools/probe_gcompris_audio_pack.py"
      - ".github/workflows/audio-pack-v2-qc.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/build_audio_pack_v2.py"
      - "tools/probe_commons_spoken_names.py"
      - "tools/probe_gcompris_audio_pack.py"
      - ".github/workflows/audio-pack-v2-qc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Probe GCompris complete human-recorded Russian alphabet pack
        run: python3 tools/probe_gcompris_audio_pack.py

      - name: Upload GCompris human reference probe
        uses: actions/upload-artifact@v4
        with:
          name: gcompris-russian-alphabet-reference
          path: build/gcompris-audio-probe/
          if-no-files-found: error
          retention-days: 7

      - name: Probe human-recorded Commons letter-name files
        run: python3 tools/probe_commons_spoken_names.py

      - name: Upload spoken-name probe report
        uses: actions/upload-artifact@v4
        with:
          name: commons-spoken-name-probe
          path: build/commons-spoken-name-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Build Kalaider25 33-letter human comparison candidate
        run: python3 tools/build_audio_pack_v2.py --output build/audio-pack-v2

      - name: Verify comparison candidate file count
        run: |
          count=$(find build/audio-pack-v2 -maxdepth 1 -type f -name 'sound_letter_*_v2.ogg' | wc -l)
          test "$count" -eq 33

      - name: Upload comparison candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-pack-v2-candidate
          path: build/audio-pack-v2/
          if-no-files-found: error
          retention-days: 7
